name: Sync Sanity CMS to Markdown

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch posts from Sanity and create markdown files
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Install minimal deps
          npm install @sanity/client gray-matter

          # Run sync script
          node scripts/sync-sanity-to-markdown.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "Sanity Sync Bot"
          git config --global user.email "bot@lahlah.ai"
          git add src/content/blog/
          git diff --staged --quiet || git commit -m "chore: sync articles from Sanity CMS [skip ci]"
          git push
